services:
  - type: web
    name: restroflow
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install && npm run build:frontend && cd backend && npm install && npm run build
    startCommand: cd backend && npx prisma db push && npm run prisma:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAIL
        value: admin@platform.com
      - key: SUPER_ADMIN_PASSWORD
        sync: false
